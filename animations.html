<!DOCTYPE html>
<html>
    <head>
        <title>Deck Shuffle</title>
    </head>
    <style>
        body{
            background-color:black;
        }
        .container{
            display:grid;
            grid-template-columns: repeat(3, 100px);
            grid-auto-rows: 50px;
            gap: 60px 60px;
            justify-content:center;
            margin: 50px auto;
        }
        .fade-in{
            background-color:navy;
            color:white;
            border-radius: 10%;
            border:none;
            opacity:0.5;
            transition:opacity 1s ease;
            cursor:pointer;
        }
        .fade-in:hover{
            opacity:1;
        }
        .fade-out{
            background-color:rgb(201, 4, 4);
            color:white;
            border-radius: 10%;
            border:none;
            opacity:0.5;
            cursor:pointer;
            animation:fadeOut 1s infinite;
        }
        .glow{
            background-color:rgb(2, 2, 63);
            color:white;
            border-radius: 10%;
            border:1px solid red;
            opacity:1;
            cursor:pointer;
            animation: glow 0.3s infinite;
        }
        .bounce{
            background-color:purple;
            color:white;
            border-radius: 10%;
            border:none;
            opacity:1;
            cursor:pointer;
            animation:bounce 0.5s infinite;
        }
        .zap{
            background-color:brown;
            color:white;
            border-radius: 10%;
            border:none;
            opacity:1;
            cursor:pointer;
            animation:zap 0.3s infinite;
        }
        .shake{
            background-color:limegreen;
            color:white;
            border-radius: 10%;
            border:none;
            opacity:1;
            cursor:pointer;
            animation:shake 0.3s infinite;
        }

        .heartbeat{
            background-color:teal;
            color:white;
            border-radius: 10%;
            border:none;
            opacity:1;
            cursor:pointer;
            animation:heartbeat 0.5s infinite;
        }
        .slide-in{
            background-color:rgb(218, 70, 105);
            color:black;
            border-radius: 10%;
            border:none;
            cursor:pointer;
            position:relative;
            overflow:hidden;
        }
        .slide-in::before{
            content:"";
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background-color:white;
            transition:translateX(-100%);
            z-index: 0;
            animation:slideIn 1s infinite;
        }
        .slide-in span{
            position:relative;
            z-index:1;
        }
        .fill-in {
             background-color:white;
            color:black;
            border-radius: 10%;
            border:none;
            cursor:pointer;
            position:relative;
            overflow:hidden;
        }
        .fill-in::before {
            content:"";
            position:absolute;
            background:orange;

            top:50%;
            left:50%;

            width:10px;
            height:10px;
            border-radius:50%;

            transform: translate(-50%,-50%) scaleX(0);
            transform-origin: center;
            animation: fillIn 0.5s infinite forwards;

            z-index:0;
        }
        .fill-in span{
            position:relative;
            z-index:1;
        }
        @keyframes fadeOut {
            0%{
                opacity:1;
            }
            25% {
                opacity:0.75;
            }
            50% {
                opacity:0.5;
            }
            75% {
                opacity:0.25;
            }
            100% {
                opacity:0;
            }
        }
        @keyframes glow {
            0% {
                box-shadow:0 0 20px rgb(57, 255, 20);
            }
            50% {
                box-shadow:0 0 20px rgb(57, 255, 20);
            }
            100% {
                box-shadow:0 0 20px rgb(57, 255, 20);
            }
        }
        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
            100% {
                transform: translateY(0);
            }
        }
        @keyframes zap {
            0% {
                transform: translateX(0);
            }
            50% {
                transform: translateX(-20px);
            }
            100% {
                transform: translateX(0);
            }
        }
        @keyframes shake {
            0%{
                transform:rotate(0deg);
            }
            20% {
                transform:rotate(10deg);
            }
            40% {
                transform:rotate(-10deg);
            }
            60% {
                transform:rotate(10deg);
            }
            80% {
                transform:rotate(-10deg);
            }
            100% {
                transform:rotate(0deg);
            }
        }
        @keyframes heartbeat {
            0%{
                transform:scale(1);
            }
            25% {
                transform:scale(1.2);
            }
            50% {
                transform:scale(1);
            }
            75% {
                transform:scale(1.3);
            }
            100% {
                transform:scale(1);
            }
        }
        @keyframes slideIn {
            0% {
                transform:translateX(-100%);
            }
            25% {
                transform:translateX(0);
            }
            50% {
                transform:translateX(0);
            }
            100% {
                transform:translateX(100%);
            }
        }
        @keyframes fillIn {
            0% {
                transform: translate(-50%,-50%) scaleX(0);
            }
            100% {
                transform: translate(-50%,-50%) scaleX(10);
            }
        }
    </style>

    <body>
       <div class="container">
        <button class="glow">Glow</button>
        <button class="bounce">Bounce</button>
        <button class="zap">Zap</button>
        <button class="shake">Shake</button>
        <button class="heartbeat">Heartbeat</button>
        <button class="slide-in">
            <span>Slide In</span>
        </button>
        <button class="fill-in">
            <span>Fill In</span>
        </button>
        <button class="fade-in">Fade In</button>
        <button class="fade-out">Fade Out</button>
           
       </div>
    </body>
</html>
