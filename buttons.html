<!DOCTYPE html>
<html>
<head>
    <title>LinkedIn Job Application</title>

    <style>
        .big-button {
            background-color: rgb(0, 94, 255);
            color: white;
            border: none;
            width: 200px;
            height: 40px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 13px;
            margin-right: 10px;
            cursor: pointer;
            vertical-align: middle;
            transition: background-color 0.3s ease,
                color 0.3s ease,;
        }
         .big-button:hover {
            background-color: rgb(225, 189, 9);
            color: black;
        }
        .big-button:active {
            background-color: rgb(255, 0, 0);
        }

        .small-button {
            background-color: rgb(0, 255, 0);
            color: black;
            border: none;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 5px;
            padding-bottom: 5px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            margin-right: 10px;
            cursor: pointer;
            transition: opacity 0.3s ease;
            transition: opacity 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 8px 8px 8px rgba(180, 4, 4, 0.5);
            vertical-align: middle;
            font-family: Times New Roman;
            font-style: italic;
        }

        .small-button:hover {
            opacity: 0.5;
            box-shadow: 8px 8px 8px rgba(180, 4, 4, 0.5);
        }
        .small-button:active {
            opacity: 0.3;
    }

    </style>
</head>

<body>
    <button class="big-button">
        Apply on Company Website
    </button>
    <button class="small-button">
        Job
    </button>
</body>
</html>
