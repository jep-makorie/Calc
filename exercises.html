<!DOCTYPE html>
<html>
    <head>
        <title> Practice </title>
        <style>
            .get-started {
                background-color:purple;
                color: white;
                padding:10px 10px 10px 10px;
                border: none;
                width: 100px;
                height: 50px;
                border-radius: 10px;
                margin-right: 20px;
                vertical-align: middle;
                font-weight: 700;

            }
            .download {
                background-color:white;
                color: gray;
                padding:10px 10px 10px 10px;
                border-color:rgb(179, 176, 176);
                border-style: solid;
                width: 100px;
                height: 50px;
                border-radius: 10px;
                margin-right: 20px;
                vertical-align: middle;
                font-weight: 700;

            }
            .glowing-btn {
                position: relative;
                width: 180px;
                height: 60px;
                border: none;
                outline: none;
                color: #fff;
                background: #111;
                cursor: pointer;
                border-radius: 10px;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 16px;
                font-weight: bold;
                margin-top:20px;
            }
            .glowing-btn::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: conic-gradient(
                    transparent, 
                    #ff007f, 
                    #7f00ff, 
                    transparent 30%
                );
                animation: rotateBorder 4s linear infinite;
            }
            .glowing-btn::after {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: conic-gradient(
                    transparent, 
                    #ff007f, 
                    #7f00ff, 
                    transparent 30%
                );
                animation: rotateBorder 4s linear infinite;
                filter: blur(20px); /* Adjust this for more or less glow intensity */
                opacity: 0.8;
                z-index: 1;
            }
            .glowing-btn span {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                width: calc(100% - 4px); /* 4px less creates a 2px visible border */
                height: calc(100% - 4px);
                background: #111; /* Matches button background */
                border-radius: 8px; /* Slightly smaller than button border-radius */
                z-index: 2; /* Sits firmly on top of the moving layers */
                transition: 0.3s;
            }
            .glowing-btn:hover span {
                background: #1a1a1a;
                color: #ff007f;
            }
            @property --angle {
                syntax: '<angle>';
                initial-value: 0deg;
                inherits: false;
            }
            .improve-btn {
                position: relative;
                width: 180px;
                height: 60px;
                border: none;
                outline: none;
                color: #fff;
                cursor: pointer;
                font-size: 16px;
                font-weight: bold;
                background: 
                    linear-gradient(#111, #111) padding-box,
                    conic-gradient(from var(--angle), transparent, #ff007f, #7f00ff, transparent 30%) border-box;
                border: 2px solid transparent; 
                border-radius: 10px;
                animation: spinGradient 4s linear infinite;
                margin-top:20px;
                margin-left:10px;
            }
            .improve::after {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: conic-gradient(from var(--angle), transparent, #ff007f, #7f00ff, transparent 30%);
                border-radius: 10px;
                z-index: -1;
                filter: blur(15px); /* Soft glow output */
                opacity: 0.7;
                animation: spinGradient 4s linear infinite;
            }
            .improve-btn:hover {
                background: 
                    linear-gradient(#1a1a1a, #1a1a1a) padding-box, 
                    conic-gradient(from var(--angle), transparent, #ff007f, #7f00ff, transparent 30%) border-box;
            }
            @keyframes spinGradient {
                0% {
                    --angle: 0deg;
                }
                100% {
                    --angle: 360deg;
                }
            }

            @keyframes rotateBorder {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

        </style>
    </head>
    <body>
        <button class="get-started">
            Get Started
        </button>
        <button class="download">
            Download
        </button>
        <button class="glowing-btn">
            <span>Glowing</span>
        </button>
        <button class="improve-btn">
         <span> Improved One</span>
        </button>


    </body>
</html>
