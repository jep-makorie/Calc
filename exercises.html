<!DOCTYPE html>
<html>
    <head>
        <title> Practice </title>
        <style>
            .get-started {
                background-color:purple;
                color: white;
                padding:10px 10px 10px 10px;
                border: none;
                width: 100px;
                height: 50px;
                border-radius: 10px;
                margin-right: 20px;
                vertical-align: middle;
                font-weight: 700;

            }
            .download {
                background-color:white;
                color: gray;
                padding:10px 10px 10px 10px;
                border-color:rgb(179, 176, 176);
                border-style: solid;
                width: 100px;
                height: 50px;
                border-radius: 10px;
                margin-right: 20px;
                vertical-align: middle;
                font-weight: 700;

            }
        </style>
    </head>
    <body>
        <button class="get-started">
            Get Started
        </button>
        <button class="download">
            Download
        </button>
    </body>
</html>
